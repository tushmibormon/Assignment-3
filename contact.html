<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="max-w-screen-xl mx-auto pt-20 pb-20 bg-[url('./assets/house.jpg')] bg-cover">
    

    <header class="flex lg:flex-row flex-col justify-center items-center gap-40">
        
       <section>
        <div class="mb-10">
            <h1 class="text-4xl font-bold mb-9">CONTACT US</h1>
          <a href="./index.html">  <button class="btn mb-4">Go to home</button></a>
            <p>Images from Freepik</p>
        </div>
        <div class="mb-10 text-black ">
            <i class="fa-solid fa-phone"></i>
            <a class="text-xl">Call Us</a>
            <p>1(234)567-891, 1(234)887-685</p>
        </div>
        <div class="mb-10 text-black ">
            <i class="fa-solid fa-location-dot"></i>
            <a class="">Location</a>
            <p>121 Rock sreet,21 Avenue,New York, Ny 98029- <br> 900</p>
        </div>
        <div class="mb-10 text-black">
            <i class="fa-solid fa-clock"></i>
            <a class="">Call Us</a>
            <p>Mon-Fri ,,,, 10 am-8 pm,Sat,Sun ,,,,Closed</p>
        </div>
       </section>

        <!--Form section -->

        <div class="">
            <form action="#" method="POST" class="space-y-6">
              <!-- Email -->
             <div class="flex lg:flex-row flex-col justify-center items-center gap-8">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      placeholder="Enter a valid email address"
                      class="w-80 p-3 "
                      required
                    />
                  </div>
              
                  <!-- Name -->
                  <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input
                      type="text"
                      id="name"
                      name="name"
                      placeholder="Enter your Name"
                      class="w-80 p-3"
                      required
                    />
                  </div>
             </div>
          
              <!-- Address -->
              <div>
                <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                <input
                  type="text"
                  id="address"
                  name="address"
                  placeholder="Enter your address"
                  class="w-full p-3"
                />
              </div>
          
              <!-- Message -->
              <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="4"
                  placeholder="Enter your message"
                  class="w-full p-3"
                  required
                ></textarea>
              </div>
          
              <!-- Submit Button -->
              <div class="">
                <button 
                    type="submit"
                    class="w-full bg-orange-500 text-white font-medium py-3 rounded-lg shadow-md hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2"
                  >
                    Submit
                  </button>
              </div>
            </form>
          </div>
        
          
    </header>
    <main>
        
          
    </main>

</body>
</html>
